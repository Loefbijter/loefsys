name: Deploy to Production

on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/loefbijter/loefsys:${{ github.event.release.tag_name }}
            ghcr.io/loefbijter/loefsys:production
            ghcr.io/loefbijter/loefsys:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The "production" Environment's required-reviewers protection rule
    # (repo Settings -> Environments -> production) is what actually gates
    # this job on a human approval -- configure it there, it's invisible here.
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Sync compose files to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,infra/scripts/backup-db.sh"
          target: "/opt/loefsys"

      - name: Backup, migrate, deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/loefsys
            export IMAGE_TAG=${{ github.event.release.tag_name }}
            chmod +x infra/scripts/backup-db.sh
            ./infra/scripts/backup-db.sh
            docker compose pull
            docker compose run --rm web python manage.py migrate --no-input
            docker compose up -d
            docker image prune -f

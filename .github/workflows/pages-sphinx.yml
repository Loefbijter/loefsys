name: Github Pages CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: default
    env:
      # Same Python as the Dockerfile. Unpinned, uv picks the newest release,
      # which psycopg-binary may not have wheels for yet.
      UV_PYTHON: "3.14"
      DJANGO_SECRET_KEY: django-insecure-loefbijter
      DJANGO_DATABASE_URL: sqlite:///db.sqlite
      DJANGO_DEBUG: true
    permissions:
      contents: write

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --group docs

      - name: Generate the docs
        run: uv run manage.py generate_docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: html-docs
          path: docs/_build/html

  deploy:
    needs: build

    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to Github Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: html-docs

{% extends "base.html" %}

{% block title %}
    Wachtwoord Succesvol Gewijzigd
{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="bg-white backdrop-blur-md shadow-2xl border-none border-t-4 border-t-secondary rounded-2xl p-10 text-center text-gray-900">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
                <svg class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900 mb-4">Wachtwoord Aangepast</h2>
            <p class="text-gray-600 mb-6">
                Uw wachtwoord is succesvol gewijzigd. U kunt nu inloggen met uw nieuwe wachtwoord.
            </p>
            <a href="{% url 'members:login' %}" class="inline-block px-8 py-3 bg-primary text-white rounded-full font-bold shadow-md hover:bg-secondary transition-all hover:-translate-y-0.5">
                Nu Inloggen
            </a>
        </div>
    </div>
</div>
{% endblock %}

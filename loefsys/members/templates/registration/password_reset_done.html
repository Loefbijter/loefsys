{% extends "base.html" %}

{% block title %}E-mail verzonden{% endblock %}

{% block content %}
<div class="min-h-screen bg-background">
    <div class="mx-auto w-full max-w-md px-4 sm:px-6 py-8">
        <c-card>
            <c-header.h4>E-mail verzonden</c-header.h4>
            <p class="mt-2 text-sm text-foreground/70">Er is een e-mail gestuurd met instructies om je wachtwoord opnieuw in te stellen. Controleer je inbox (en spammap).</p>
            <div class="mt-4">
                <a href="{% url 'members:login' %}" class="inline-flex items-center gap-2 rounded-lg bg-secondary px-4 py-2 text-sm font-semibold text-secondary-foreground">Terug naar inloggen</a>
            </div>
        </c-card>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% load static i18n %}

{% block title %}{% trans "Wachtwoord vergeten" %}{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh] gap-8 py-16">
    <img src="{% static 'loefbijter-logo.svg' %}" alt="Loefbijter logo" class="h-24 w-auto" />

    <div class="max-w-3xl rounded-[2rem] border border-white/10 bg-secondary/90 p-10 shadow-2xl text-center">
        <p class="text-sm font-semibold uppercase tracking-[0.35em] text-white/70">
            Wachtwoord vergeten?
        </p>
        <p class="mt-4 text-lg leading-8 text-white/80 sm:text-xl">
            Neem contact op met <a href="mailto:webcie@loefbijter.nl" class="font-bold text-white underline">webcie@loefbijter.nl</a>, wij maken zo snel mogelijk een nieuw wachtwoord voor je aan.
        </p>
    </div>
</div>
{% endblock %}

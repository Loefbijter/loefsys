{% extends "base.html" %}

{% block title %}Wachtwoord vergeten{% endblock %}

{% block content %}
<div class="min-h-screen bg-background">
    <div class="mx-auto w-full max-w-md px-4 sm:px-6 py-8">
        <c-card>
            <c-header.h4>Wachtwoord vergeten</c-header.h4>
            <p class="text-sm text-foreground/60 mt-2">Voer je e-mailadres in; we sturen een link om je wachtwoord opnieuw in te stellen.</p>

            <form method="post" class="mt-4 space-y-4">
                {% csrf_token %}
                {{ form.email.errors }}
                <div>
                    <label class="block text-sm font-medium text-slate-700">E-mailadres</label>
                    {{ form.email }}
                </div>

                <div class="flex gap-2">
                    <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground transition hover:bg-primary/80">
                        Verstuur e-mail
                    </button>

                    <a href="{% url 'members:login' %}" class="inline-flex items-center justify-center gap-2 rounded-lg bg-secondary px-4 py-2 text-sm font-semibold text-secondary-foreground transition hover:bg-tertiary">
                        Terug naar inloggen
                    </a>
                </div>
            </form>
        </c-card>
    </div>
</div>
{% endblock %}

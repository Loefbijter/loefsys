[project]
name = "loefsys"
version = "0.1.0"
description = "The in-house developed website of N.S.Z.V. Loefbijter."
authors = [{name = "Loefbijter Webcie", email = "webcie@loefbijter.nl"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "celery[redis]>=5.5.2",
    "clsx>=0.1.1",
    "dj-database-url>=2.3.0",
    "django>=5.2.19,<6",
    "django-compressor>=4.6.0",
    "django-cotton>=2.5.0",
    "django-extensions>=3.2.3",
    "django-ical>=1.9.2",
    "django-localflavor>=4.0",
    "django-phonenumber-field>=9.0.0",
    "django-phonenumbers>=1.0.1",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2.4",
    "pyjwt>=2.15.0",
    "pytailwindcss>=0.4.2",
    "python-dotenv>=1.2.2",
   "openpyxl>=3.1.0",
   "python-dateutil>=2.8.2",
   "starmerge>=0.2.0",
   "user-agent-parser>=0.2.1",
   "whitenoise>=6.8.2",
]

[dependency-groups]
dev = [
    "celery-stubs==0.1.3",
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=8.0.0",
    "django-dynamic-fixture>=4.0.1",
    "django-stubs>=5.1.2",
    "mypy>=2.4.1",
    "playwright==1.63.*",
    "pre-commit>=4.1.0",
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-playwright>=0.7",
    "ruff>=0.17.6",
    "types-python-dateutil>=2.9.0.20260807",
]
docs = [
    "sphinx>=9.1.1",
    "sphinx-rtd-theme>=3.0.2",
    "sphinxcontrib-mermaid>=2.1.1",
]

[tool.ruff]
extend-exclude = ["migrations"]
fix = true
indent-width = 4
line-length = 88
show-fixes = true
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = true

[tool.ruff.lint]
ignore = ["D105", "D106", "D203", "D213", "D416", "ISC001"]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "D",
    "UP",
    "A",
    "DJ",
    "ISC",
    "PIE",
    "Q",
    "INT",
    "ARG",
    "PL",
    "RUF"
]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["D100", "D101", "D102", "D104"]
"**/__init__.py" = ["PLC0415"]
"**/__disabled__.**.py" = ["N999"]
# pytest fixtures are requested by argument name, and HTTP status codes read fine.
"e2e/*" = ["ARG001", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
known-first-party = ["loefsys"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
packages = ["loefsys"]
exclude = [
    ".*/migrations/.*",
    ".*__disabled__.*",
    "manage.py"
]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "loefsys.settings"
strict_settings = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "loefsys.settings"
testpaths = ["e2e"]
pythonpath = ["."]
addopts = "--browser chromium"

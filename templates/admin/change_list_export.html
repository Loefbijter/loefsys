{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
    {{ block.super }}
    {% if can_export %}
    <li>
        <a
            href="{% url opts|admin_urlname:'export_excel' %}?{{ request.GET.urlencode }}"
            class="addlink"
        >
            {% trans "Export filtered rows" %}
        </a>
    </li>
    {% endif %}
{% endblock %}

{% load static tailwind %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- <meta content="translucent-black" name="apple-mobile-web-app-status-bar-style"> -->
    <title>{% block title %}{% endblock %} | Loefbijter</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="{% static 'loefbijter-logo.svg' %}">
    <link rel="preload" href="{% tailwind_static 'globals.css' %}" as="style">
    <link rel="stylesheet" href="{% tailwind_static 'globals.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.css">
    {% block head %}{% endblock head %}
</head>
<body class="bg-primary text-primary-foreground">
<div class="flex flex-col w-full min-h-screen bg-background text-foreground">
    {# Header #}
    <div class="sticky grid top-0 z-1000">
        {% if is_mobile %}
            <c-menu.mobile/>
        {% else %}
            <c-menu.desktop/>
        {% endif %}
        <c-waves base="top"/>
    </div>
    {# Main content #}
    <div class="grid gap-6 p-6">
        {% block content %}
        {% endblock %}
    </div>
    {# Footer #}

    {% if not is_mobile %}
        <footer class="mt-auto justify-self-end">
            <c-waves base="bottom"/>
        </footer>
    {% endif %}
</div>
</body>
</html>

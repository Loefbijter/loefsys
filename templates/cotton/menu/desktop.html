{% load static %}
{% load requireapp %}
<nav class="relative flex items-center justify-between gap-4 p-4 bg-primary text-primary-foreground">
    <c-logo />
    <div class="hidden md:flex gap-4 items-center">
        {% requireapp "loefsys.events" %}
        <c-menu.item href="{% url 'events:events' %}">Activiteiten</c-menu.item>
        {% endrequireapp %}
        {% requireapp "loefsys.reservations" %}
        <c-menu.item href="{% url 'reservations:reservations' %}">Reserveringen</c-menu.item>
        <c-menu.item href="">Reserveer</c-menu.item>
        {% endrequireapp %}
        <c-menu.item>Gallerij</c-menu.item>

        {# About dropdown #}
        <div class="relative" id="about-menu">
            <button id="about-toggle" data-target="#about-dropdown" aria-expanded="false" aria-haspopup="true"
                class="about-toggle font-bold hover:underline flex items-center gap-1 py-2 px-3 rounded whitespace-nowrap">
                Over ons
                <svg id="about-chevron" class="about-chevron w-3 h-3 transition-transform duration-200 shrink-0"
                    style="transform: rotate(0deg);" fill="none" stroke="currentColor" stroke-width="2.5"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
            <div id="about-dropdown" role="menu"
                class="about-dropdown hidden absolute top-full left-0 mt-1 w-48 bg-white rounded shadow-xl border border-gray-200 z-50">
                <a href="{% url 'home:association-information' %}" role="menuitem"
                    class="block px-4 py-2 text-secondary hover:bg-gray-100 first:rounded-t last:rounded-b">
                    Over de Vereniging
                </a>
                <a href="{% url 'home:schipperschap' %}" role="menuitem"
                    class="block px-4 py-2 text-secondary hover:bg-gray-100 first:rounded-t last:rounded-b">
                    Schipperschap
                </a>
                <a href="{% url 'home:styleguide' %}" role="menuitem"
                    class="block px-4 py-2 text-secondary hover:bg-gray-100 first:rounded-t last:rounded-b">
                    Styleguide
                </a>
                <a href="{% url 'home:verenigingslied' %}" role="menuitem"
                    class="block px-4 py-2 text-secondary hover:bg-gray-100 first:rounded-t last:rounded-b">
                    Verenigingslied
                </a>
            </div>
        </div>
    </div>
    <c-profile-icon class="ml-auto" />
</nav>
<script src="{% static 'JS/navbar.js' %}" defer></script>

{% comment %}
A card that folds out, as used on the information pages. Needs static/JS/info_tabs.js.
Usage: <c-accordion-card id="kb1" title="KB1-schipper" sub="Schipper" icon="life-preserver" open>body</c-accordion-card>
`icon` is a Bootstrap Icons name shown in the round badge; `open` starts it unfolded.
{% endcomment %}
<c-vars id="" title="" sub="" icon="" open="" />
<c-card>
    <div class="accordion-item" data-accordion>
        <button type="button" data-accordion-trigger aria-expanded="{% if open %}true{% else %}false{% endif %}" aria-controls="content-{{ id }}"
            class="w-full flex items-center justify-between gap-3 text-left py-1">
            <span class="flex items-center gap-3 min-w-0">
                {% if icon %}<span class="shrink-0 inline-flex items-center justify-center w-11 h-11 rounded-full bg-primary/10 text-primary text-lg mx-3"><i class="bi bi-{{ icon }}" aria-hidden="true"></i></span>{% endif %}
                <span class="min-w-0">
                    <span class="block text-base sm:text-lg font-bold text-foreground">{{ title }}</span>
                    {% if sub %}<span class="block text-xs font-semibold text-secondary">{{ sub }}</span>{% endif %}
                </span>
            </span>
            <svg data-chevron class="shrink-0 transition-transform duration-300" {% if open %}style="transform: rotate(180deg)"{% endif %} viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>

        <div id="content-{{ id }}" data-accordion-content style="display: grid; grid-template-rows: {% if open %}1fr{% else %}0fr{% endif %}; transition: grid-template-rows 300ms ease;">
            <div class="overflow-hidden">
                <div class="pt-5 pb-1 space-y-4 text-sm text-foreground/90">
                    {{ slot }}
                </div>
            </div>
        </div>
    </div>
</c-card>

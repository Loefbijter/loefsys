{% comment %}Status pill. kind: ok, warn, bad, info or empty for neutral.{% endcomment %}
<c-vars kind="" icon="" class="" />
<span class="chip {% if kind %}chip-{{ kind }}{% endif %} {{ class }}">{% if icon %}<i class="bi bi-{{ icon }}" aria-hidden="true"></i>{% elif kind == "ok" %}<i class="bi bi-check2" aria-hidden="true"></i>{% endif %}{{ slot }}</span>

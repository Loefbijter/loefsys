<input
        type="{{ widget.type }}"
        name="{{ widget.name }}"
        {% if widget.value != None %}
        value="{{ widget.value|stringformat:'s' }}"
        {% endif %}
        {% include "django/forms/widgets/attrs.html" %}
        {% if widget.type == 'checkbox' %}
        class="h-4 w-4 shrink-0 rounded border-tertiary text-secondary accent-secondary outline-none focus:ring-2 focus:ring-secondary/40 focus:ring-offset-2 focus:ring-offset-background disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive"
        {% elif widget.type == 'radio' %}
        class="h-4 w-4 shrink-0 rounded-full border-tertiary text-secondary accent-secondary outline-none focus:ring-2 focus:ring-secondary/40 focus:ring-offset-2 focus:ring-offset-background disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive"
        {% elif widget.type == 'file' %}
        class="block w-full min-w-0 rounded-md border border-tertiary bg-background px-3 py-2 text-sm text-foreground file:mr-4 file:rounded-md file:border-0 file:bg-secondary file:px-3 file:py-1 file:text-sm file:font-medium file:text-secondary-foreground hover:file:bg-secondary/80 outline-none disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive"
        {% elif widget.type == 'hidden' %}
        {% else %}
        class="h-9 w-full min-w-0 rounded-md border border-tertiary bg-background px-3 py-1 text-base text-foreground placeholder:text-secondary-foreground/60 selection:bg-tertiary selection:text-tertiary-foreground outline-none disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive"
        {% endif %}
>
